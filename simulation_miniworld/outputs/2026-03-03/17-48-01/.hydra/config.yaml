sim:
  steps: 500
  seed: 0
  render_mode: rgb_array
  save_video: true
  video_fps: 5
  start_time: 08:00
  seconds_per_step: 40
world:
  num_rooms: 4
  building_scale: 1.0
  fire_spread_rate: 0.03
llm:
  provider: ollama
  model: llama3.2:latest
  base_url: http://localhost:11434
  max_tokens: 200
personas:
  file: configs/personas/persona_spec.yaml
  personas_in_sim:
  - human_1
  - human_2
data:
  route_choice_priors_file: data/route_choice_priors.json
openai:
  openai_api_key: ''
  key_owner: ''
